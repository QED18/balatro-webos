name: Build native Balatro for webOS IPK

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'native/**'
      - 'app/icon.png'
      - 'app/largeIcon.png'
      - '.github/workflows/native-smoke-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x86_64 webOS IPK
    # Run manually because it downloads the webOS SDK and builds the native
    # runtime. The resulting artifact contains no owner-supplied game files.
    # The SDK binary requires GLIBC 2.36+, which the Ubuntu 24.04 image supplies.
    runs-on: ubuntu-24.04
    env:
      SDK_TAG: 2026.08-webos
      SDK_ARCHIVE: arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
      SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/2026.08-webos/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake build-essential cmake curl g++-multilib gcc-multilib git libtool ninja-build pkg-config
          python3 -m pip install --user 'cmake==3.21.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cmake" --version
          npm install --global @webos-tools/cli

      - name: Fetch and relocate pinned webOSbrew SDK
        run: |
          curl --fail --location --retry 3 --output "$SDK_ARCHIVE" "$SDK_URL"
          sha256sum "$SDK_ARCHIVE" | tee sdk.sha256
          tar -xzf "$SDK_ARCHIVE"
          ./arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh

      - name: Verify source policy and build ARM IPK
        env:
          WEBOS_SDK: ${{ github.workspace }}/arm-webos-linux-gnueabi_sdk-buildroot
        run: |
          python3 scripts/verify-source.py
          bash native/scripts/build-webos.sh
          sha256sum dist/*.ipk | tee dist/SHA256SUMS
          test -n "$(find dist -maxdepth 1 -name 'io.github.qed18.balatro_*_arm.ipk' -size +0c -print -quit)"

      - name: Publish game-file-free CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: balatro-webos-ipk-${{ github.sha }}
          path: |
            dist/*.ipk
            dist/SHA256SUMS
            sdk.sha256
          if-no-files-found: error
          retention-days: 7
