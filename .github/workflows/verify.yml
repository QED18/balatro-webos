name: Verify game-file-free smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-source.py
      - run: git ls-files | grep -E -i '(balatro\\.(exe|love)|(^|/)(game-data|user-data|saves)/)' && exit 1 || exit 0
